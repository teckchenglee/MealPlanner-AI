name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (syntax errors and undefined names)
        run: ruff check . --select=E9,F

      - name: Verify all modules import cleanly
        run: python -c "import app, analyzer, llm, parse, prompts, main"

  smoke-check:
    needs: lint-and-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed app is reachable
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 15 --retry-all-errors \
            https://mealplanner-ai.streamlit.app/ -o /dev/null
